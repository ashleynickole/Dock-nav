<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missile Studios Glass Tab Bar</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    font-family: Manrope, Arial, Helvetica, sans-serif;
  }
  body {
    display: grid;
    place-items: center;
    padding: 12px;
    overflow: hidden;
  }
  .dock {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    align-items: center;
    width: calc(100vw - 24px);
    min-width: 360px;
    max-width: 960px;
    padding: 13px 18px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.07) 42%, rgba(255,255,255,.035) 100%),
      rgba(22,22,22,.46);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow:
      0 12px 24px rgba(0,0,0,.22),
      0 4px 10px rgba(0,0,0,.16),
      0 1px 3px rgba(0,0,0,.10),
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(255,255,255,.06);
    animation: dockIn .65s cubic-bezier(.2,.8,.2,1) both;
  }
  .dock::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    backdrop-filter: blur(28px) saturate(1.65) brightness(.92);
    -webkit-backdrop-filter: blur(28px) saturate(1.65) brightness(.92);
    background:
      radial-gradient(circle at 18% 0%, rgba(255,255,255,.14), transparent 34%),
      radial-gradient(circle at 82% 100%, rgba(255,255,255,.06), transparent 38%);
  }

  .dock::after {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: -10px;
    height: 18px;
    z-index: -2;
    border-radius: 999px;
    background: rgba(0,0,0,.18);
    filter: blur(11px);
    opacity: .58;
    pointer-events: none;
  }
  .tab::before {
    content: "";
    position: absolute;
    inset: -4px -3px;
    z-index: -1;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    box-shadow: none;
    opacity: 0;
    transform: scale(.92);
    transition:
      opacity .22s ease,
      transform .32s cubic-bezier(.22,1,.36,1),
      background .22s ease,
      border-color .22s ease;
    pointer-events: none;
  }

  .tab.active::before {
    opacity: 1;
    transform: scale(1);
    background: rgba(255,255,255,.11);
    border-color: rgba(255,255,255,.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }

  .tab[data-page="home"]::before,
  .tab[data-page="home"].active::before {
    display: none;
  }

  .tab:first-of-type::before {
    left: -3px;
    right: -3px;
  }

  .tab:last-of-type::before {
    left: -3px;
    right: -3px;
  }
  .tab {
    position: relative;
    z-index: 1;
    min-width: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 4px 6px;
    color: rgba(255,255,255,.48);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: color .18s ease, transform .12s ease;
  }
  .tab:active { transform: scale(.85); }
  .tab[data-page="home"]:active { transform: scale(.92); }
  .tab:hover, .tab:focus-visible { color: rgba(255,255,255,.74); }
  .tab.active { color: #fff; }
  .inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .icon-wrap {
    width: 25px;
    height: 25px;
    display: grid;
    place-items: center;
    transition: transform .28s cubic-bezier(.2,.9,.2,1);
  }
  .tab.active .icon-wrap { transform: translateY(-1px) scale(1.15); }

  .tab img.icon {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }

  .tab[data-page="home"] .icon-wrap {
    width: 38px;
    height: 38px;
  }

  .tab[data-page="home"] img.icon {
    width: 36px;
    height: 36px;
    opacity: 1;
  }

  .tab[data-page="home"]:hover img.icon,
  .tab[data-page="home"]:focus-visible img.icon,
  .tab[data-page="home"].active img.icon {
    opacity: 1;
  }

  .tab[data-page="book"] {
    color: #fff;
  }

  .tab[data-page="book"] .icon,
  .tab[data-page="book"] .label {
    opacity: 1;
    color: #fff;
  }
  .icon {
    width: 25px;
    height: 25px;
    object-fit: contain;
    display: block;
    opacity: .48;
    transition: opacity .18s ease;
  }
  .tab:hover .icon, .tab:focus-visible .icon { opacity: .74; }
  .tab.active .icon { opacity: 1; }
  svg.icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 1;
  }
  .label {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    line-height: 1.15;
    font-weight: 500;
  }
  @keyframes dockIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }


  /* 2026 refinements: larger logo, unified color, realistic frosted glass */
  :root {
    --dock-ink: rgba(255,255,255,.90);
    --dock-ink-hover: rgba(255,255,255,1);
  }

  .dock {
    padding: 12px 18px;
    overflow: visible;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,.23) 0%,
        rgba(255,255,255,.105) 17%,
        rgba(255,255,255,.055) 54%,
        rgba(255,255,255,.025) 78%,
        rgba(255,255,255,.085) 100%),
      linear-gradient(105deg,
        rgba(255,255,255,.075) 0%,
        rgba(255,255,255,.018) 34%,
        rgba(255,255,255,.055) 67%,
        rgba(255,255,255,.014) 100%),
      rgba(18,18,20,.30);
    border: 1px solid rgba(255,255,255,.30);
    box-shadow:
      0 10px 18px rgba(0,0,0,.22),
      0 3px 7px rgba(0,0,0,.20),
      0 1px 2px rgba(0,0,0,.22),
      inset 0 1px 0 rgba(255,255,255,.48),
      inset 0 -1px 0 rgba(255,255,255,.10),
      inset 1px 0 0 rgba(255,255,255,.10),
      inset -1px 0 0 rgba(255,255,255,.06);
  }

  .dock::before {
    inset: 1px;
    border-radius: inherit;
    backdrop-filter: blur(26px) saturate(1.28) contrast(1.06) brightness(.98);
    -webkit-backdrop-filter: blur(26px) saturate(1.28) contrast(1.06) brightness(.98);
    background:
      linear-gradient(180deg,
        rgba(255,255,255,.18) 0%,
        rgba(255,255,255,.035) 24%,
        transparent 48%),
      radial-gradient(ellipse 44% 68% at 17% -10%, rgba(255,255,255,.28), transparent 66%),
      radial-gradient(ellipse 38% 52% at 82% 112%, rgba(255,255,255,.085), transparent 72%),
      linear-gradient(112deg,
        transparent 10%,
        rgba(255,255,255,.045) 26%,
        transparent 43%,
        rgba(255,255,255,.026) 72%,
        transparent 89%);
    box-shadow:
      inset 0 0 18px rgba(255,255,255,.025),
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(0,0,0,.08);
  }

  .dock::after {
    left: 7%;
    right: 7%;
    bottom: -7px;
    height: 11px;
    border-radius: 999px;
    background: rgba(0,0,0,.30);
    filter: blur(5px);
    opacity: .72;
    box-shadow: 0 3px 7px rgba(0,0,0,.14);
  }

  .tab,
  .tab[data-page="book"],
  .tab.active {
    color: var(--dock-ink);
  }

  .tab .icon,
  .tab .label,
  .tab[data-page="book"] .icon,
  .tab[data-page="book"] .label,
  .tab.active .icon {
    color: inherit;
    opacity: 1;
  }

  .tab img.icon {
    filter: brightness(0) invert(1);
    opacity: .90;
  }

  .tab:hover,
  .tab:focus-visible,
  .tab[data-page="book"]:hover,
  .tab[data-page="book"]:focus-visible {
    color: var(--dock-ink-hover);
  }

  .tab:hover img.icon,
  .tab:focus-visible img.icon {
    opacity: 1;
  }

  /* No tab receives a persistent selected-page capsule or active enlargement. */
  .tab::before,
  .tab.active::before {
    display: none !important;
  }

  .tab.active .icon-wrap {
    transform: none;
  }

  .tab[data-page="home"] .icon-wrap {
    width: 52px;
    height: 52px;
  }

  .tab[data-page="home"] img.icon {
    width: 49px;
    height: 49px;
    opacity: .98;
  }

  .tab[data-page="home"] .inner {
    transform: translateY(-1px);
  }

  @media (max-width: 520px) {
    .dock {
      min-width: 0;
      padding: 10px 10px;
      box-shadow:
        0 8px 14px rgba(0,0,0,.22),
        0 2px 5px rgba(0,0,0,.20),
        0 1px 2px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.46),
        inset 0 -1px 0 rgba(255,255,255,.09);
    }
    .dock::after {
      bottom: -6px;
      height: 9px;
      filter: blur(4px);
    }
    .tab {
      padding-inline: 3px;
    }
    .tab[data-page="home"] .icon-wrap {
      width: 46px;
      height: 46px;
    }
    .tab[data-page="home"] img.icon {
      width: 43px;
      height: 43px;
    }
  }



  /* Brand mark is a standalone logo, not a sixth navigation icon */
  :root {
    --dock-ink: rgba(242,242,244,.76);
    --dock-ink-hover: rgba(250,250,252,.90);
    --logo-ink: rgba(255,255,255,1);
  }

  .dock {
    grid-template-columns: minmax(78px, 1.32fr) repeat(5, minmax(0, 1fr));
  }

  .tab[data-page="home"] {
    align-self: stretch;
    justify-content: center;
    padding: 0 10px 0 5px;
    color: var(--logo-ink);
    overflow: visible;
  }

  .tab[data-page="home"] .inner {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    transform: none;
    overflow: visible;
  }

  .tab[data-page="home"] .icon-wrap {
    width: 100%;
    height: 58px;
    overflow: visible;
    display: grid;
    place-items: center;
  }

  .tab[data-page="home"] img.icon {
    width: 68px;
    height: 58px;
    max-width: none;
    object-fit: contain;
    opacity: 1;
    filter: brightness(0) invert(1);
    transform: scale(1.26);
    transform-origin: center;
  }

  .tab:not([data-page="home"]),
  .tab[data-page="book"],
  .tab.active:not([data-page="home"]) {
    color: var(--dock-ink);
  }

  .tab:not([data-page="home"]) svg.icon {
    stroke: currentColor;
  }

  .tab:not([data-page="home"]) .label {
    color: currentColor;
  }

  .tab:not([data-page="home"]):hover,
  .tab:not([data-page="home"]):focus-visible {
    color: var(--dock-ink-hover);
  }

  @media (max-width: 520px) {
    .dock {
      grid-template-columns: minmax(68px, 1.26fr) repeat(5, minmax(0, 1fr));
    }

    .tab[data-page="home"] {
      padding-left: 2px;
      padding-right: 7px;
    }

    .tab[data-page="home"] .icon-wrap {
      width: 100%;
      height: 52px;
    }

    .tab[data-page="home"] img.icon {
      width: 62px;
      height: 52px;
      transform: scale(1.24);
    }
  }


  /* Reference-matched glass and dimensional navigation lettering */
  :root {
    --logo-ink: rgba(255,255,255,.98);
    --nav-ink: rgba(226,226,229,.90);
    --nav-ink-hover: rgba(244,244,246,.98);
  }

  .dock {
    overflow: hidden;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,.13) 0%,
        rgba(255,255,255,.045) 20%,
        rgba(255,255,255,.018) 55%,
        rgba(0,0,0,.045) 100%),
      linear-gradient(104deg,
        rgba(255,255,255,.055) 0%,
        rgba(255,255,255,.012) 38%,
        rgba(255,255,255,.035) 67%,
        rgba(255,255,255,.008) 100%),
      rgba(22,22,24,.34);
    border: 1px solid rgba(255,255,255,.44);
    box-shadow:
      0 9px 16px rgba(0,0,0,.22),
      0 2px 5px rgba(0,0,0,.18),
      0 1px 1px rgba(0,0,0,.22),
      inset 0 1px 0 rgba(255,255,255,.56),
      inset 0 -1px 0 rgba(255,255,255,.17),
      inset 1px 0 0 rgba(255,255,255,.13),
      inset -1px 0 0 rgba(255,255,255,.08);
  }

  .dock::before {
    inset: 0;
    z-index: -1;
    backdrop-filter: blur(20px) saturate(1.18) contrast(1.04);
    -webkit-backdrop-filter: blur(20px) saturate(1.18) contrast(1.04);
    background:
      radial-gradient(ellipse 70% 55% at 50% -18%, rgba(255,255,255,.20), transparent 62%),
      linear-gradient(180deg,
        rgba(255,255,255,.07) 0%,
        transparent 34%,
        rgba(0,0,0,.045) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 10px 22px rgba(255,255,255,.025),
      inset 0 -10px 20px rgba(0,0,0,.035);
  }

  .dock::after {
    left: 9%;
    right: 9%;
    bottom: -5px;
    height: 8px;
    background: rgba(0,0,0,.35);
    filter: blur(4px);
    opacity: .68;
    box-shadow: 0 2px 4px rgba(0,0,0,.16);
  }

  .tab:not([data-page="home"]),
  .tab[data-page="book"],
  .tab.active:not([data-page="home"]) {
    color: var(--nav-ink);
  }

  .tab:not([data-page="home"]) .label {
    color: currentColor;
    font-weight: 600;
    letter-spacing: .01em;
    text-shadow:
      0 1px 0 rgba(255,255,255,.22),
      0 2px 2px rgba(0,0,0,.46),
      0 4px 7px rgba(0,0,0,.20);
  }

  .tab:not([data-page="home"]) svg.icon {
    stroke: currentColor;
    filter:
      drop-shadow(0 1px 0 rgba(255,255,255,.20))
      drop-shadow(0 2px 2px rgba(0,0,0,.45));
  }

  .tab[data-page="home"] img.icon {
    opacity: 1;
    filter:
      brightness(0) invert(1)
      drop-shadow(0 1px 0 rgba(255,255,255,.28))
      drop-shadow(0 2px 3px rgba(0,0,0,.30));
  }

  .tab:not([data-page="home"]):hover,
  .tab:not([data-page="home"]):focus-visible {
    color: var(--nav-ink-hover);
  }

  @media (max-width: 520px) {
    .dock {
      box-shadow:
        0 7px 12px rgba(0,0,0,.22),
        0 2px 4px rgba(0,0,0,.17),
        0 1px 1px rgba(0,0,0,.20),
        inset 0 1px 0 rgba(255,255,255,.54),
        inset 0 -1px 0 rgba(255,255,255,.15);
    }
  }


  /* Final refinement: slimmer dimensional labels and a unified line icon set */
  .tab:not([data-page="home"]) .label {
    font-weight: 400;
    letter-spacing: .015em;
    text-shadow:
      0 .5px 0 rgba(255,255,255,.18),
      0 1px 1px rgba(0,0,0,.34),
      0 2px 3px rgba(0,0,0,.14);
  }

  .tab:not([data-page="home"]) svg.icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter:
      drop-shadow(0 .5px 0 rgba(255,255,255,.16))
      drop-shadow(0 1px 1px rgba(0,0,0,.32));
  }

  .tab[data-page="about"] .studio-bolt {
    width: 25px;
    height: 25px;
  }

</style>
