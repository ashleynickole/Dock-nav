<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missile Studios Glass Tab Bar</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: transparent;
    font-family: Manrope, Arial, Helvetica, sans-serif;
  }
  body {
    display: grid;
    place-items: center;
    padding: 12px;
    overflow: hidden;
  }
  .dock {
    position: relative;
    isolation: isolate;
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    align-items: center;
    width: calc(100vw - 24px);
    min-width: 360px;
    max-width: 960px;
    padding: 13px 18px;
    border-radius: 999px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.07) 42%, rgba(255,255,255,.035) 100%),
      rgba(22,22,22,.46);
    border: 1px solid rgba(255,255,255,.22);
    box-shadow:
      0 12px 24px rgba(0,0,0,.22),
      0 4px 10px rgba(0,0,0,.16),
      0 1px 3px rgba(0,0,0,.10),
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(255,255,255,.06);
    animation: dockIn .65s cubic-bezier(.2,.8,.2,1) both;
  }
  .dock::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    backdrop-filter: blur(28px) saturate(1.65) brightness(.92);
    -webkit-backdrop-filter: blur(28px) saturate(1.65) brightness(.92);
    background:
      radial-gradient(circle at 18% 0%, rgba(255,255,255,.14), transparent 34%),
      radial-gradient(circle at 82% 100%, rgba(255,255,255,.06), transparent 38%);
  }

  .dock::after {
    content: "";
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: -10px;
    height: 18px;
    z-index: -2;
    border-radius: 999px;
    background: rgba(0,0,0,.18);
    filter: blur(11px);
    opacity: .58;
    pointer-events: none;
  }
  .tab::before {
    content: "";
    position: absolute;
    inset: -4px -3px;
    z-index: -1;
    border-radius: 999px;
    background: transparent;
    border: 1px solid transparent;
    box-shadow: none;
    opacity: 0;
    transform: scale(.92);
    transition:
      opacity .22s ease,
      transform .32s cubic-bezier(.22,1,.36,1),
      background .22s ease,
      border-color .22s ease;
    pointer-events: none;
  }

  .tab.active::before {
    opacity: 1;
    transform: scale(1);
    background: rgba(255,255,255,.11);
    border-color: rgba(255,255,255,.10);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }

  .tab[data-page="home"]::before,
  .tab[data-page="home"].active::before {
    display: none;
  }

  .tab:first-of-type::before {
    left: -3px;
    right: -3px;
  }

  .tab:last-of-type::before {
    left: -3px;
    right: -3px;
  }
  .tab {
    position: relative;
    z-index: 1;
    min-width: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding: 4px 6px;
    color: rgba(255,255,255,.48);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: color .18s ease, transform .12s ease;
  }
  .tab:active { transform: scale(.85); }
  .tab[data-page="home"]:active { transform: scale(.92); }
  .tab:hover, .tab:focus-visible { color: rgba(255,255,255,.74); }
  .tab.active { color: #fff; }
  .inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .icon-wrap {
    width: 25px;
    height: 25px;
    display: grid;
    place-items: center;
    transition: transform .28s cubic-bezier(.2,.9,.2,1);
  }
  .tab.active .icon-wrap { transform: translateY(-1px) scale(1.15); }

  .tab img.icon {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }

  .tab[data-page="home"] .icon-wrap {
    width: 38px;
    height: 38px;
  }

  .tab[data-page="home"] img.icon {
    width: 36px;
    height: 36px;
    opacity: 1;
  }

  .tab[data-page="home"]:hover img.icon,
  .tab[data-page="home"]:focus-visible img.icon,
  .tab[data-page="home"].active img.icon {
    opacity: 1;
  }

  .tab[data-page="book"] {
    color: #fff;
  }

  .tab[data-page="book"] .icon,
  .tab[data-page="book"] .label {
    opacity: 1;
    color: #fff;
  }
  .icon {
    width: 25px;
    height: 25px;
    object-fit: contain;
    display: block;
    opacity: .48;
    transition: opacity .18s ease;
  }
  .tab:hover .icon, .tab:focus-visible .icon { opacity: .74; }
  .tab.active .icon { opacity: 1; }
  svg.icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 1;
  }
  .label {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 10px;
    line-height: 1.15;
    font-weight: 500;
  }
  @keyframes dockIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
</style>

<script>
(() => {
  const tabs = [...document.querySelectorAll('.tab')];

  function detectPage() {
    const values = [];
    try { values.push(window.top.location.href); } catch (e) {}
    if (document.referrer) values.push(document.referrer);
    values.push(window.location.href);

    const forced = new URLSearchParams(window.location.search).get('page');
    if (forced) values.unshift(forced);

    const source = values.join(' ').toLowerCase();
    if (source.includes('/book') || source.includes('page=book')) return 'book';
    if (source.includes('/info') || source.includes('page=info')) return 'info';
    if (source.includes('/portfolio') || source.includes('page=portfolio')) return 'portfolio';
    if (source.includes('/services') || source.includes('page=services')) return 'services';
    if (source.includes('/about') || source.includes('page=about') || source.includes('page=studio')) return 'about';
    return 'home';
  }

  function activate(page) {
    const active = tabs.find(tab => tab.dataset.page === page) || tabs[0];
    tabs.forEach(tab => {
      const isHome = tab.dataset.page === 'home';
      const on = tab === active && !isHome;
      tab.classList.toggle('active', on);
      if (on) tab.setAttribute('aria-current', 'page');
      else tab.removeAttribute('aria-current');
    });
  }

  tabs.forEach(tab => tab.addEventListener('click', () => activate(tab.dataset.page)));
  window.addEventListener('resize', () => activate(document.querySelector('.tab.active')?.dataset.page || detectPage()));
  window.addEventListener('message', event => {
    if (typeof event.data !== 'string') return;
    const v = event.data.toLowerCase();
    if (v.includes('book')) activate('book');
    else if (v.includes('info')) activate('info');
    else if (v.includes('portfolio')) activate('portfolio');
    else if (v.includes('services')) activate('services');
    else if (v.includes('about') || v.includes('studio')) activate('about');
    else if (v.includes('home')) activate('home');
  });

  requestAnimationFrame(() => activate(detectPage()));
})();
</script>
